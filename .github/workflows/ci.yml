name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --filter "Category!=Integration" --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  # Contract check (spec §8): the Jellyfin actions and arguments Currents' filters match on must exist in the
  # Jellyfin version the packages target. A Renovate bump of Jellyfin.Controller changes the image tag below.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the targeted Jellyfin
        run: |
          version="$(sed -n 's:.*Include="Jellyfin.Controller" Version="\([0-9]*\.[0-9]*\)\..*:\1:p' src/Jellyfin.Plugin.Currents/Jellyfin.Plugin.Currents.csproj)"
          echo "Jellyfin ${version}"
          docker run -d --name jellyfin -p 8096:8096 "jellyfin/jellyfin:${version}"
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8096/api-docs/openapi.json -o openapi.json; then exit 0; fi
            sleep 2
          done
          docker logs jellyfin | tail -50
          exit 1
      - name: Check the contract
        run: python3 dev/check-contract.py openapi.json
