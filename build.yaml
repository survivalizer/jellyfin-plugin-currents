framework: "net10.0"
owner: "survivalizer"
overview: "AIOStreams & AIOMetadata for Jellyfin"
description: >
  Brings AIOMetadata catalogs into your Jellyfin library as real titles and plays them
  through AIOStreams.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Currents.dll"
changelog: "1.0: requires Jellyfin 12.1. Poster and subtitle downloads reach only public addresses (plus your AIOStreams/AIOMetadata host and port); stream redirects to another site carry only harmless headers; built-in text subtitles are hidden on files over 15 GB (configurable) so playback never waits for Jellyfin to read the whole file; /Search/Hints lists AIOMetadata results; anonymous subtitle requests get 404 instead of 500; new configuration, self-service and troubleshooting guides."
