changelog: "Search auto-add: Jellyfin search also lists AIOMetadata titles that are not in the library yet, and opening one adds it and shows the real item. Per-user search switch (admin off, self-service, default). Search-added series get new episodes on catalog sync. AIOMetadata responses are now size-capped."
