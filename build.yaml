changelog: "1.0.1: built-in subtitles stay hidden on large files after a server restart; subtitle requests for ids that name no version of the item get 404 instead of 500; IPv6-only servers behind DNS64 can download posters and subtitles again; library artwork downloads only from public addresses (plus your AIOStreams/AIOMetadata host and port); \"Fetch skip markers\" no longer loads the whole library; AniSkip and ARM have separate rate limits."
